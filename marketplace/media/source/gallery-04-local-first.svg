    <circle cx="105" cy="86" r="5" fill="#c9ff4a"/>
    <text x="125" y="90" class="mono" fill="#8d9788" font-size="16" font-weight="600" letter-spacing="3">04 / LOCAL-FIRST ARCHITECTURE</text>
    <text x="100" y="180" class="sans" fill="#f1f3ed" font-size="72" font-weight="650" letter-spacing="-3">Three local parts.</text>
    <text x="100" y="256" class="sans" fill="#c9ff4a" font-size="72" font-weight="650" letter-spacing="-3">No Dion Labs cloud.</text>
    <text x="1070" y="173" class="sans" fill="#8d9788" font-size="21">Your prompts and session contents stay between</text>
    <text x="1070" y="207" class="sans" fill="#8d9788" font-size="21">the software already running on your Mac.</text>
