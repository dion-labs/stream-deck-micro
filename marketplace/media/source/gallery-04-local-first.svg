    <text x="28" y="134" class="sans" fill="#f1f3ed" font-size="28" font-weight="650">Codex Desktop</text>
    <text x="28" y="176" class="sans" fill="#8d9788" font-size="17">Keeps session ownership</text>
    <text x="28" y="205" class="sans" fill="#8d9788" font-size="17">and the full conversation</text>
  </g>
